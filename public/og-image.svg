<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#11130F"/>
  
  <!-- Subtle architectural grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1F231C" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Geometric V Icon -->
  <g transform="translate(100, 100)">
    <rect width="80" height="80" rx="16" fill="#181B15" stroke="#262A22" stroke-width="2"/>
    <path d="M18 20L36 60H44L62 20H51L40 46L29 20H18Z" fill="#F5F3ED"/>
    <polygon points="40,46 48,26 54,26 43,52 37,52" fill="#D6F36A"/>
  </g>

  <!-- Wordmark & Kicker -->
  <text x="200" y="145" fill="#F5F3ED" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="0.18em">VARENO</text>
  <text x="200" y="170" fill="#9E9E94" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="0.25em">FULL-STACK WEB DEVELOPMENT</text>

  <!-- Main Headline -->
  <text x="100" y="310" fill="#F5F3ED" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.02em">
    Web experiences built to move
  </text>
  <text x="100" y="375" fill="#F5F3ED" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.02em">
    your business forward.
  </text>

  <!-- Supporting value line with lime bullet -->
  <circle cx="106" cy="460" r="5" fill="#D6F36A"/>
  <text x="125" y="465" fill="#9E9E94" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Business-focused development. Clear scope. Careful execution.
  </text>

  <!-- Capability markers -->
  <g transform="translate(100, 520)">
    <rect width="210" height="42" rx="8" fill="#181B15" stroke="#262A22" stroke-width="1"/>
    <text x="15" y="26" fill="#F5F3ED" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Business Websites</text>
  </g>
  <g transform="translate(330, 520)">
    <rect width="220" height="42" rx="8" fill="#181B15" stroke="#262A22" stroke-width="1"/>
    <text x="15" y="26" fill="#F5F3ED" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Full-Stack Web Apps</text>
  </g>
  <g transform="translate(570, 520)">
    <rect width="230" height="42" rx="8" fill="#181B15" stroke="#262A22" stroke-width="1"/>
    <text x="15" y="26" fill="#F5F3ED" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Agency Dev Partner</text>
  </g>
</svg>
